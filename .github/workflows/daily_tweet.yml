name: Auto Tweet Bot

on:
  schedule:
    - cron: '0 3,9 * * *' # 매일 한국 시간 오후 12시, 오후 6시 (UTC 3:00, 9:00)
  workflow_dispatch:      # 수동 실행 버튼

jobs:
  tweet:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install -r requirements.txt

      # [중요] 데이터 생성 (만약 data 폴더가 git에 없다면 이 단계 필수)
      # data 폴더가 git에 이미 올라가 있다면 이 단계는 삭제해도 됩니다.
      - name: Generate Data (if missing)
        env:
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
        run: |
          python scripts/1.batch_generator.py

      - name: Run Auto Tweet
        env:
          TWITTER_API_KEY: ${{ secrets.TWITTER_API_KEY }}
          TWITTER_API_SECRET: ${{ secrets.TWITTER_API_SECRET }}
          TWITTER_ACCESS_TOKEN: ${{ secrets.TWITTER_ACCESS_TOKEN }}
          TWITTER_ACCESS_SECRET: ${{ secrets.TWITTER_ACCESS_SECRET }}
        # [수정됨] 경로를 scripts/auto_tweet.py 로 변경
        run: python scripts/auto_tweet.py